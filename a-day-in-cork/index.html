<!doctype html>
<html lang="en">
<!-- ds:exempt: personal card for Josh (family, not an enibas artefact); after the birthday card Josh made for Anna -->
<meta charset="utf-8">
<title>A Day in Cork</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cousine&family=Inter:wght@300&family=Instrument+Serif:ital@0;1&display=swap">
<style>
  /* One look, no dark variant: one flat cream everywhere (the pictures sit on it with no box),
     ink lines, the paintings' violet. A real map of West Cork and Cork city (OpenStreetMap,
     redrawn in the card's colours); the van drives the real road and each stop opens one of
     the five approved paintings. */
  :root{
    --paper:#F9E6C4;
    --sea:#EBDCC8;
    --ink:#2B2D57;
    --violet:#6060A2;
    --spring:cubic-bezier(.2,1.35,.4,1);
    --ease:cubic-bezier(.65,0,.2,1);
  }
  html,body{height:100%}
  body{margin:0; overflow:hidden; background:var(--paper); color:var(--ink); cursor:pointer;
       font:300 15px/1.4 Inter,system-ui,sans-serif; -webkit-tap-highlight-color:transparent; user-select:none}
  .label{font:400 11px/1.2 Cousine,ui-monospace,monospace; letter-spacing:.14em; text-transform:uppercase}

  /* ---------- the map ---------- */
  #map{position:fixed; inset:0; width:100%; height:100%; display:block; transition:opacity 900ms var(--ease)}
  body:not(.on) #map{opacity:.32}
  #map path{vector-effect:non-scaling-stroke}
  #map #road, #map #road-done{vector-effect:none}   /* sized by hand each frame, so the dots show at every zoom */
  .sea{fill:var(--sea); stroke:none; fill-rule:evenodd}
  .coast{fill:none; stroke:var(--violet); stroke-width:1; stroke-opacity:.6; stroke-linejoin:round}
  .lee{fill:var(--sea); stroke:var(--violet); stroke-width:.7; stroke-opacity:.5}
  .river{fill:none; stroke:var(--violet); stroke-width:.8; opacity:.3; stroke-linecap:round}
  .rd{fill:none; stroke:var(--ink); stroke-linecap:round; stroke-linejoin:round}
  .rd.major{stroke-width:1.1; opacity:.2}
  .rd.minor{stroke-width:.7; opacity:.13}
  .wave{fill:none; stroke:var(--violet); stroke-width:1.1; stroke-linecap:round; opacity:.32}
  .route-base{fill:none; stroke:var(--ink); stroke-linecap:round; stroke-linejoin:round; opacity:.35}
  .route-done{fill:none; stroke:var(--ink); stroke-linecap:round; stroke-linejoin:round}
  #van .bob{transform-box:fill-box; transform-origin:50% 100%}
  body.driving #van .bob{animation:bob .5s ease-in-out infinite alternate}
  @keyframes bob{to{transform:translateY(-1px)}}

  /* labels live in screen space, so they stay the same size at every zoom */
  body.ready .lb{transition:opacity 450ms}
  .lb text{font-family:Cousine,monospace; letter-spacing:.12em; text-transform:uppercase; fill:var(--ink);
           paint-order:stroke; stroke:var(--paper); stroke-width:3px; stroke-linejoin:round}
  .lb.town circle{fill:var(--ink); opacity:.35} .lb.town text{opacity:.32}
  .lb.town.on circle{opacity:.85} .lb.town.on text{opacity:.8}
  .lb.ctx circle{fill:var(--ink); opacity:.22} .lb.ctx text{opacity:.3}
  .lb.area text{opacity:.38; font-style:normal}
  .lb.water text{font-family:"Instrument Serif",Georgia,serif; font-style:italic; letter-spacing:0; text-transform:none; fill:var(--violet); opacity:.75; stroke:var(--sea)}
  .lb.stop circle{fill:var(--paper); stroke:var(--ink); stroke-width:1.6px; transition:fill 400ms}
  .lb.stop text{opacity:.6; transition:opacity 400ms}
  .lb.stop.on circle{fill:var(--ink)} .lb.stop.on text{opacity:1}
  .lb.stop.here circle{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{stroke-width:6px; stroke-opacity:.35}}
  .compass{fill:var(--ink); opacity:.6; font-family:Cousine,monospace}
  .compass path{stroke:var(--ink); stroke-width:1.2px; fill:none}
  .credit{font-family:Cousine,monospace; fill:var(--ink); opacity:.4; letter-spacing:.06em}

  /* ---------- the title ---------- */
  .title{position:fixed; inset:0; display:grid; place-content:center; justify-items:center; text-align:center; gap:14px;
         padding:0 16px; pointer-events:none; transition:opacity 600ms var(--ease)}
  .title p{margin:0}
  body.on .title{opacity:0}
  .title h1{margin:0; font:400 clamp(56px,15vw,120px)/.92 "Instrument Serif",Georgia,serif; letter-spacing:-.02em}
  .title .tap{margin-top:22px; opacity:.7; animation:blink 2.4s ease-in-out infinite}
  @keyframes blink{50%{opacity:.25}}
  .corner{position:fixed; top:calc(18px + env(safe-area-inset-top,0px)); left:max(18px, env(safe-area-inset-left,0px));
          margin:0; padding:6px 8px 6px 0; background:var(--paper); box-shadow:0 0 14px 10px var(--paper);
          opacity:0; transition:opacity 600ms var(--ease) 400ms}
  .corner b{display:block; font:400 26px/1 "Instrument Serif",Georgia,serif; letter-spacing:-.01em; text-transform:none; margin-bottom:5px}
  body.on .corner{opacity:1}

  /* ---------- the stop card: same cream as the page, a hairline, no box shadow ---------- */
  .card{position:fixed; z-index:3; left:50%; bottom:0; width:min(640px, 100%); box-sizing:border-box;
        padding:22px max(16px, env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px));
        background:var(--paper); border-top:1px solid var(--ink);
        display:grid; justify-items:center; text-align:center; gap:10px;
        transform:translate(-50%, 104%); transition:transform 480ms cubic-bezier(.5,-0.3,.75,.3)}
  .card.open{transform:translate(-50%, 0); transition:transform 900ms var(--spring)}
  @media (min-width:700px){ .card{border:1px solid var(--ink); border-bottom:0} }
  .card .kicker{margin:0; opacity:.7}
  .card .pic{position:relative; width:100%; height:min(30vh, 290px)}
  .card .pic[hidden]{display:none}
  .card .pic img{position:absolute; inset:0; width:100%; height:100%; display:block; object-fit:contain; object-position:50% 100%}
  .card.open .pic img{animation:breathe 6s ease-in-out 1.2s infinite}
  @keyframes breathe{50%{translate:0 -3px}}
  .say{position:relative; z-index:1; margin:0; min-height:1em; font:400 clamp(28px, 7.4vw, 44px)/1.04 "Instrument Serif",Georgia,serif; letter-spacing:-.015em; text-wrap:balance}
  .say .ln{display:block}
  .say .w{display:inline-block; white-space:pre; opacity:0; transform:translateY(.4em);
          transition:opacity 420ms var(--ease), transform 620ms var(--spring); transition-delay:calc(450ms + var(--i) * 65ms)}
  .card.open .say .w{opacity:1; transform:none}
  .card .hint{margin:4px 0 0; opacity:.45}
  #extra{display:grid; justify-items:center; gap:10px}

  .yes{all:unset; box-sizing:border-box; cursor:pointer; padding:15px 26px; margin-top:6px; border:1px solid var(--ink);
       background:var(--ink); color:var(--paper); transition:background 200ms, color 200ms}
  .yes:hover{background:var(--paper); color:var(--ink)}
  .yes:focus-visible{outline:2px solid var(--violet); outline-offset:3px}
  .from{margin:0; font:italic 400 clamp(22px,6vw,30px)/1.1 "Instrument Serif",Georgia,serif}
  .plan{margin:6px 0 0; display:grid; grid-template-columns:auto 1fr; gap:8px 16px; text-align:left; align-items:baseline}
  .plan dt{opacity:.6} .plan dd{margin:0; font-size:15px}
  /* phones: a smaller picture so the map gets room, and the plan stacked so nothing wraps awkwardly */
  @media (max-width:520px){
    .card{gap:8px; padding-top:18px}
    .card .pic{height:min(25vh, 220px)}
    .plan{grid-template-columns:1fr; gap:0; text-align:center; margin-top:10px}
    .plan dt{margin-top:12px} .plan dt:first-child{margin-top:0}
    .plan dd{margin-top:3px; font-size:16px}
    .from{margin-top:2px}
  }
  .again{all:unset; cursor:pointer; margin-top:6px; opacity:.55; border-bottom:1px solid currentColor; padding-bottom:2px}
  .again:focus-visible{outline:2px solid var(--violet); outline-offset:3px}

  /* nightfall: the bus home after dinner runs in the dark, morning comes up before the car */
  #night{position:fixed; inset:0; pointer-events:none; background:#1c2150; mix-blend-mode:multiply; opacity:0; transition:opacity 1600ms var(--ease)}
  body.night #night{opacity:.66}
  .corner{transition:opacity 600ms var(--ease) 400ms, color 1600ms var(--ease), background-color 1600ms var(--ease), box-shadow 1600ms var(--ease)}
  body.night .corner{color:var(--paper); background-color:transparent; box-shadow:0 0 14px 10px transparent}
  .note{margin:0; font-size:16px}
  #confetti{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:6}
  /* on wide screens the map data runs out at the edges: soften them into the paper */
  .edge{position:fixed; inset:0; pointer-events:none; background:radial-gradient(ellipse 70% 75% at 50% 50%, transparent 60%, var(--paper) 100%)}
  @media (max-aspect-ratio:4/5){ .edge{display:none} }

  @media (prefers-reduced-motion:reduce){
    #map, .title, .corner, .card, .card.open, .lb{transition:none}
    .lb.stop.here circle, .card.open .pic img, body.driving #van .bob, .title .tap{animation:none}
    .say .w{transition:opacity 200ms; transform:none; transition-delay:0ms}
  }
</style>

    const seg = CUM[hi] - CUM[lo] || 1, t = Math.max(0, Math.min(1, (d - CUM[lo]) / seg));
    return {i:lo, x:R[lo][0] + (R[hi][0] - R[lo][0]) * t, y:R[lo][1] + (R[hi][1] - R[lo][1]) * t};
  }
  const nearest = pt => { let b = 0, bd = 1e9; R.forEach((p, i) => { const d = (p[0] - pt[0]) ** 2 + (p[1] - pt[1]) ** 2; if (d < bd && CUM[i] <= AT[6]){ bd = d; b = i; } }); return CUM[b]; };

  // ---------- labels (screen space) ----------
  LABELS.forEach(l => {
    const g = document.createElementNS(NS, 'g'); g.setAttribute('class', 'lb ' + l.cls);
    if (l.cls !== 'water' && l.r !== 0){
      const c = document.createElementNS(NS, 'circle'); c.setAttribute('r', l.cls === 'stop' ? 5.5 : l.cls === 'ctx' ? 2 : 2.6); g.append(c);
    }
    const t = document.createElementNS(NS, 'text'); t.setAttribute('x', l.dx); t.setAttribute('y', l.dy);
    t.setAttribute('text-anchor', l.anchor); t.setAttribute('font-size', l.size); t.textContent = l.name; g.append(t);
    labels.append(g); l.el = g;
    if (l.cls === 'town' && l.name !== 'Cork') l.at = nearest(l.pt);
    if (l.name === 'Cork') l.at = AT[6] - 40;
  });
  const STOPLB = ['Schull', 'Douglas', 'Sonflour', 'Padel', 'Douglas'].map(n => LABELS.find(l => l.name === n));
  const compass = document.createElementNS(NS, 'g'); compass.setAttribute('class', 'compass');
  compass.innerHTML = '<path d="M0,22 L0,-6 M-5,1 L0,-6 L5,1"/><text x="-4" y="38" font-size="11">N</text>';
  const credit = document.createElementNS(NS, 'text'); credit.setAttribute('class', 'credit'); credit.setAttribute('font-size', 8);
  credit.setAttribute('text-anchor', 'end'); credit.textContent = 'map © OpenStreetMap';
  labels.append(compass, credit);

  // ---------- the camera: a world point held at a screen point, at a zoom ----------
  // Zoom is in screen px per km, so it reads the same on any screen.
  let cam = {x:300, y:410, ppk:4, fy:innerHeight / 2}, m = svg.getScreenCTM(), S = m.a;
  const fx = () => innerWidth / 2;
  function overview(){
    const xs = R.map(p => p[0]), ys = R.map(p => p[1]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    const ppk = 6 * Math.min(innerWidth * .78 / (x1 - x0), innerHeight * .5 / (y1 - y0));
    return {x:(x0 + x1) / 2, y:(y0 + y1) / 2, ppk, fy:innerHeight * .5};
  }
  const cardFy = () => Math.max(110, (innerHeight - card.offsetHeight) * .56);
  let vanFlip = 1, len = 0;
  const VEH = {van:$('veh-van'), bus:$('veh-bus'), car:$('veh-car')};
  let vehNow = 'van', morning = true;
  function vehicle(){
    const v = len <= AT[6] + .5 ? 'van' : (len < AT[8] - .5 || !morning) ? 'bus' : 'car';
    if (v !== vehNow){ VEH[vehNow].style.display = 'none'; VEH[v].style.display = ''; vehNow = v; }
  }
  function render(){
    m = svg.getScreenCTM(); S = m.a;
    const z = cam.ppk / (6 * S);                       // world units -> viewBox units
    const tx = (fx() - m.e) / S - z * cam.x, ty = (cam.fy - m.f) / S - z * cam.y;
    world.setAttribute('transform', `translate(${tx.toFixed(2)},${ty.toFixed(2)}) scale(${z.toFixed(4)})`);
    const px = 1 / (S * z);                            // one screen px in world units
    road.style.strokeWidth = 1.6 * px; road.style.strokeDasharray = `${.1 * px} ${6 * px}`;
    done.style.strokeWidth = 3.4 * px; done.style.strokeDasharray = `${.1 * px} ${7 * px}`;
    const q = pointAt(len), q2 = pointAt(Math.min(TOTAL, len + 1.5));
    vanFlip = 1;                                       // the van always faces right, so it never flickers
    vehicle();
    const vk = Math.min(110, innerWidth * .24) / 92 * px;
    van.setAttribute('transform', `translate(${q.x.toFixed(2)},${(q.y - 2 * px).toFixed(2)}) scale(${(vanFlip * vk).toFixed(4)},${vk.toFixed(4)})`);
    // labels
    const k = 1 / S;
    LABELS.forEach(l => {
      const X = tx + z * l.pt[0], Y = ty + z * l.pt[1];
      l.el.setAttribute('transform', `translate(${X.toFixed(1)},${Y.toFixed(1)}) scale(${k.toFixed(4)})`);
      const show = cam.ppk >= l.lo && cam.ppk <= l.hi;
      l.el.style.opacity = show ? '' : 0;
      if (l.at != null) l.el.classList.toggle('on', len >= l.at - .5);
    });
    STOPS.forEach((s, i) => { if (len >= AT[s.at] - .5) STOPLB[i].el.classList.add('on'); });
    if (len < .5) STOPLB.slice(1).forEach(l => l.el.classList.remove('on'));
    const vb = svg.viewBox.baseVal;
    compass.setAttribute('transform', `translate(${((innerWidth - 30 - m.e) / S).toFixed(1)},${((Math.max(28, 20 + (window.visualViewport ? 0 : 0)) + 10 - m.f) / S).toFixed(1)}) scale(${k.toFixed(4)})`);
    credit.setAttribute('transform', `translate(${((innerWidth - 8 - m.e) / S).toFixed(1)},${((innerHeight - 6 - m.f) / S).toFixed(1)}) scale(${k.toFixed(4)})`);
    // the full route drawn so far
    const p = pointAt(len); done.setAttribute('d', len > 0 ? dOf(R.slice(0, p.i + 1).concat([[p.x, p.y]])) : 'M0,0');
  }
  // Smoothly move the camera; zoom moves in log space so it feels even.
  let camRaf = 0;
  function moveCam(to, dur, done2){
    cancelAnimationFrame(camRaf);
    const from = {...cam}, t0 = performance.now();
    if (reduce || !dur){ cam = {...to}; render(); done2 && done2(); return; }
    const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    (function f(t){
      const k = Math.min(1, (t - t0) / dur), e = ease(k);
      cam = {x:from.x + (to.x - from.x) * e, y:from.y + (to.y - from.y) * e, fy:from.fy + (to.fy - from.fy) * e,
             ppk:Math.exp(Math.log(from.ppk) + (Math.log(to.ppk) - Math.log(from.ppk)) * e)};
      render();
      if (k < 1) camRaf = requestAnimationFrame(f); else done2 && done2();
    })(t0);
  }
  const shot = i => ({x:STOPS[i].pt[0], y:STOPS[i].pt[1], ppk:STOPS[i].ppk, fy:cardFy()});
  addEventListener('resize', () => {
    if (phase === 'card') cam = shot(stop); else if (phase === 'title' || phase === 'ask' || phase === 'done') cam = overview();
    render();
  });

  // ---------- the card ----------
  function words(text, start){
    return text.split(' ').map((w, i, a) => `<span class="w" style="--i:${start + i}">${w}${i < a.length - 1 ? ' ' : ''}</span>`).join('');
  }
  let phase = 'title', stop = -1, raf = 0, wait = 0;
  function fill(s){
    kicker.textContent = s.kicker; leg.textContent = s.day;
    pic.hidden = false; img.src = 'josh-cork-day/img/' + s.img + '.webp?v=10'; img.alt = s.alt;
    say.innerHTML = `<span class="ln">${words(s.lines[0], 0)}</span><span class="ln">${words(s.lines[1], s.lines[0].split(' ').length + 2)}</span>`;
    extra.innerHTML = ''; hint.hidden = false;
  }
  const open = () => card.classList.add('open');
  const close = () => card.classList.remove('open');
  function here(i){ LABELS.forEach(l => l.el.classList.remove('here')); if (i >= 0) STOPLB[i].el.classList.add('here'); }

  // ---------- the run ----------
  function arrive(i, dur = 1100){
    stop = i; phase = 'card'; here(i); fill(STOPS[i]);
    requestAnimationFrame(() => requestAnimationFrame(() => { open(); moveCam(shot(i), dur); }));
  }
  // Sonflour to padel is two drives: the bus home on Saturday night, then the car on Sunday.
  function drive(i){
    const to = AT[STOPS[i].at];
    if (len < AT[8] - .5 && to > AT[8] + .5){
      leg.textContent = 'Saturday night'; morning = false; body.classList.add('night');
      const later = (f, ms) => setTimeout(() => { if (phase === 'driving') f(); }, reduce ? 0 : ms);
      return driveTo(AT[8], STOPS[i].ppk, () => later(() => {
        leg.textContent = 'Sunday morning'; body.classList.remove('night');            // the sun comes up
        later(() => { morning = true; vehicle(); leg.textContent = 'Sunday';             // and the VW is outside
          later(() => driveTo(to, STOPS[i].ppk, () => arrive(i, 900), true), 700); }, 1500);
      }, 900));
    }
    driveTo(to, STOPS[i].ppk, () => arrive(i, 900));
  }
  function driveTo(to, ppkTo, then, cont){
    phase = 'driving'; if (!cont){ close(); here(-1); }
    const from = len, km = (to - from) / 6;
    const dur = reduce ? 0 : Math.max(2200, Math.min(6500, km * 48));
    const a = {...cam}, b = ppkTo, mid = innerHeight / 2;
    const dip = km > 40 ? Math.min(.75, km / 110) : 0;   // only the long West Cork drive pulls back; Cork stays zoomed in              // pull back on long drives, so you see where you are
    clearTimeout(wait); cancelAnimationFrame(camRaf);
    wait = setTimeout(() => {
      if (phase !== 'driving') return;
      body.classList.add('driving');
      const t0 = performance.now();
      const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      (function step(t){
        if (phase !== 'driving') return;
        const k = dur ? Math.min(1, (t - t0) / dur) : 1, e = ease(k);
        len = from + (to - from) * e;
        const q = pointAt(len), lz = Math.log(a.ppk) + (Math.log(b) - Math.log(a.ppk)) * e;
        const settle = Math.min(1, k / .18);           // first part of the drive: the camera slides onto the van
        cam = {x:a.x + (q.x - a.x) * settle, y:a.y + (q.y - a.y) * settle, fy:a.fy + (mid - a.fy) * settle,
               ppk:Math.exp(lz) * (1 - dip * Math.sin(Math.PI * k))};
        render();
        if (k < 1) raf = requestAnimationFrame(step);
        else { body.classList.remove('driving'); then(); }
      })(t0);
    }, reduce || cont ? 0 : 380);
  }
  function ending(){
    phase = 'ask'; close(); here(-1);
    moveCam(overview(), 1800);
    setTimeout(() => {
      kicker.textContent = 'A trip to Cork'; leg.textContent = 'Sunday'; pic.hidden = true;
      say.innerHTML = `<span class="ln">${words('Are you in?', 0)}</span>`;
      extra.innerHTML = '<button class="yes label" id="yes" type="button">Count me in</button>';
      hint.hidden = true; open();
      $('yes').addEventListener('click', yes);
      const o = overview(); o.fy = Math.max(90, (innerHeight - card.offsetHeight) * .5);
      o.ppk *= Math.min(1, (innerHeight - card.offsetHeight - 40) / (innerHeight * .5)); moveCam(o, 1200);
    }, reduce ? 0 : 900);
  }
  function yes(e){
    e.stopPropagation(); phase = 'done';
    const r = e.currentTarget.getBoundingClientRect();
    say.innerHTML = `<span class="ln">${words('See you Saturday for a trip to Cork.', 0)}</span>`;
    extra.innerHTML = `<p class="note">We can't wait to spend some time with you.</p>
      <p class="from">love Anna-Leah &amp; Paddy</p>
      <dl class="plan">
        <dt class="label">saturday 28th, 7:15pm</dt><dd>Dinner at Sonflour, Castle Street</dd>
        <dt class="label">sunday 29th, 2pm</dt><dd>Padel at Fota with Taidgh</dd>
        <dt class="label">4:30pm</dt><dd>The Arsenal game on our sofa</dd>
      </dl>
      <button class="again label" id="again" type="button">go again</button>`;
    card.classList.remove('open'); void card.offsetWidth; card.classList.add('open');
    $('again').addEventListener('click', ev => { ev.stopPropagation(); restart(); });
    confetti(r.left + r.width / 2, r.top);
  }
  function restart(){
    cancelAnimationFrame(raf); clearTimeout(wait); phase = 'busy'; close(); body.classList.remove('driving', 'night'); morning = true;
    setTimeout(() => { len = 0; render(); arrive(0, 1600); }, reduce ? 0 : 500);
  }

  function advance(){
    if (phase === 'title'){ body.classList.add('on'); phase = 'busy'; setTimeout(() => arrive(0, 1600), reduce ? 0 : 500); return; }
    if (phase === 'driving'){   // a tap mid-drive jumps to the stop
      cancelAnimationFrame(raf); clearTimeout(wait); const i = stop + 1; phase = 'busy'; morning = true; body.classList.remove('night'); if (STOPS[i].day) leg.textContent = STOPS[i].day;
      len = AT[STOPS[i].at]; body.classList.remove('driving'); arrive(i, 700); return;
    }
    if (phase === 'card'){ stop < STOPS.length - 1 ? drive(stop + 1) : ending(); }
  }
  body.addEventListener('click', advance);
  addEventListener('keydown', e => {
    if ((e.key === ' ' || e.key === 'ArrowRight' || e.key === 'Enter') && !(document.activeElement && document.activeElement.tagName === 'BUTTON')){
      e.preventDefault(); advance();
    }
  });

  // Confetti in Arsenal red, white, gold and redcurrant.
  function confetti(ox, oy){
    if (reduce) return;
    const c = $('confetti'), x = c.getContext('2d'), dpr = devicePixelRatio || 1;
    c.width = innerWidth * dpr; c.height = innerHeight * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0);
    const cols = ['#DB0007', '#FFFFFF', '#C9A227', '#7A1F2B', '#2B2D57'];
    const P = Array.from({length:170}, () => ({x:ox, y:oy, vx:(Math.random() - .5) * 14, vy:-Math.random() * 15 - 6,
      w:6 + Math.random() * 6, h:8 + Math.random() * 8, r:Math.random() * 6, vr:(Math.random() - .5) * .3,
      c:cols[(Math.random() * cols.length) | 0]}));
    const t0 = performance.now();
    (function frame(t){
      const k = (t - t0) / 1000; x.clearRect(0, 0, innerWidth, innerHeight);
      P.forEach(p => { p.vy += .42; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        const hh = p.h * Math.abs(Math.cos(p.r * 2)) + 2;
        x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.globalAlpha = Math.max(0, 1 - k / 3.2);
        x.fillStyle = p.c; x.fillRect(-p.w / 2, -hh / 2, p.w, hh);
        if (p.c === '#FFFFFF'){ x.strokeStyle = 'rgba(43,45,87,.25)'; x.strokeRect(-p.w / 2, -hh / 2, p.w, hh); }
        x.restore(); });
      if (k < 3.3) requestAnimationFrame(frame); else x.clearRect(0, 0, innerWidth, innerHeight);
    })(t0);
  }

  cam = overview(); render();
  requestAnimationFrame(() => requestAnimationFrame(() => body.classList.add('ready')));
})();
</script>
